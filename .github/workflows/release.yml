name: release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10
      - run: |
          PROJECT=$(basename --suffix=.csproj *.csproj)
          for RUNTIME in linux-arm64 linux-musl-x64 linux-x64 osx-arm64 win-x64; do
            dotnet publish "$PROJECT.cs" --runtime "$RUNTIME" --self-contained --output "publish/$RUNTIME" \
              --property:PublishSingleFile=true --property:IncludeNativeLibrariesForSelfExtract=true \
              --property:InvariantGlobalization=true \
              --property:DebugType=none \
              --property:Product="$GITHUB_REPOSITORY" --property:Version="$GITHUB_REF_NAME"
            zip --junk-paths "$PROJECT-$RUNTIME.zip" "publish/$RUNTIME/$PROJECT"*
          done
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "$PROJECT-"*.zip "$PROJECT.cs" "$PROJECT.sh"
        env:
          GH_TOKEN: ${{ github.token }}
